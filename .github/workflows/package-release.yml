name: Package WordPress Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build WordPress plugin ZIP
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          git archive \
            --format=zip \
            --prefix=music-project-core/ \
            --output="music-project-core-${VERSION}.zip" \
            HEAD

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "music-project-core-${VERSION}.zip" \
            --clobber